<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sök – Link Up</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sok.js" defer></script>
</head>
<body data-page="sok">
  <main id="main">
    <div class="page-head">
      <h1 id="search-title">Sök</h1>
      <form action="sok.html" role="search" class="row" style="max-width:560px">
        <label class="sr-only" for="q">Sökord</label>
        <input type="search" id="q" name="q" style="flex:1" placeholder="Sök ämnen, grupper, aktiviteter...">
        <button type="submit" class="btn btn-primary">Sök</button>
      </form>
    </div>
    <div id="results" class="stack" aria-live="polite"></div>
  </main>
</body>
</html>
